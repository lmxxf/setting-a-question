<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380">
  <defs>
    <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-curr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-sw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="410" y="32" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#0f172a">题 3 图：含受控源非互易二端口网络 N 与双端有源外电路</text>

  <!-- 二端口虚线框 -->
  <rect x="245" y="54" width="310" height="246" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="400" y="74" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#334155">含受控源线性二端口网络 N</text>

  <!-- ===== 上水平母线 y=115 ===== -->
  <!-- 左侧电压源支路 x=115 -->
  <line x1="115" y1="115" x2="115" y2="185" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="115" cy="207" r="22" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <text x="115" y="201" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">+</text>
  <text x="115" y="221" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">−</text>
  <text x="88" y="212" text-anchor="end" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#0f172a">Us₁ = 32 V</text>
  <line x1="115" y1="229" x2="115" y2="300" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 顶部导线：115 -> Rs 左端 -->
  <line x1="115" y1="115" x2="151" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- Rs 水平电阻 中心 (175,115) -->
  <rect x="151" y="106" width="48" height="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <text x="175" y="99" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#0f172a">Rs = 2 Ω</text>
  <line x1="199" y1="115" x2="235" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- I1 箭头 -->
  <line x1="212" y1="115" x2="232" y2="115" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-ctrl)"/>
  <text x="222" y="105" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#dc2626">I₁</text>

  <!-- 端口 1 空心圆 -->
  <circle cx="235" cy="115" r="5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="235" y="103" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#0f172a">1</text>

  <!-- 端口1 -> R1 左端 -->
  <line x1="240" y1="115" x2="271" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- R1 水平电阻 中心 (295,115) -->
  <rect x="271" y="106" width="48" height="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <text x="295" y="99" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#0f172a">R₁ = 2 Ω</text>
  <line x1="319" y1="115" x2="365" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 节点 M -->
  <circle cx="365" cy="115" r="3.8" fill="#0f172a"/>
  <text x="365" y="103" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#0f172a">M</text>

  <!-- M -> R3 左端 -->
  <line x1="365" y1="115" x2="401" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- R3 水平电阻 中心 (425,115) -->
  <rect x="401" y="106" width="48" height="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <text x="425" y="99" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#0f172a">R₃ = 2 Ω</text>
  <line x1="449" y1="115" x2="469" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- VCVS 水平受控电压源 中心 (495,115) -->
  <polygon points="469,115 495,95 521,115 495,135" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.2"/>
  <text x="485" y="120" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#b91c1c">−</text>
  <text x="505" y="120" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#b91c1c">+</text>
  <text x="495" y="89" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#b91c1c">4I₁</text>
  <line x1="521" y1="115" x2="555" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 端口 2 空心圆 -->
  <circle cx="555" cy="115" r="5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="555" y="103" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#0f172a">2</text>

  <!-- I2 箭头（从右向左流入端口2） -->
  <line x1="595" y1="115" x2="568" y2="115" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-ctrl)"/>
  <text x="582" y="105" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#dc2626">I₂</text>

  <!-- 端口2 -> 右侧并联节点 -->
  <line x1="560" y1="115" x2="635" y2="115" stroke="#0f172a" stroke-width="2.2"/>
  <line x1="635" y1="115" x2="715" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 并联电流源 Is2 垂直支路 x=635 -->
  <line x1="635" y1="115" x2="635" y2="187" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="635" cy="207" r="20" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <line x1="635" y1="218" x2="635" y2="196" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow-curr)"/>
  <text x="609" y="212" text-anchor="end" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#0f172a">Is₂ = 8 A</text>
  <line x1="635" y1="227" x2="635" y2="300" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 并联负载电阻 RL 垂直支路 x=715 -->
  <line x1="715" y1="115" x2="715" y2="183" stroke="#0f172a" stroke-width="2.2"/>
  <rect x="706" y="183" width="18" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <text x="731" y="212" text-anchor="start" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#0f172a">RL = 6 Ω</text>
  <line x1="715" y1="231" x2="715" y2="300" stroke="#0f172a" stroke-width="2.2"/>

  <!-- IL 箭头（向下） -->
  <line x1="715" y1="140" x2="715" y2="165" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-ctrl)"/>
  <text x="731" y="155" text-anchor="start" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#dc2626">IL</text>

  <!-- ===== 下水平公共母线 y=300 ===== -->
  <line x1="115" y1="300" x2="715" y2="300" stroke="#0f172a" stroke-width="2.2"/>

  <!-- R2 垂直电阻 中心 (365,207) -->
  <line x1="365" y1="115" x2="365" y2="183" stroke="#0f172a" stroke-width="2.2"/>
  <rect x="356" y="183" width="18" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <text x="381" y="212" text-anchor="start" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#0f172a">R₂ = 4 Ω</text>
  <line x1="365" y1="231" x2="365" y2="300" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="365" cy="300" r="3.8" fill="#0f172a"/>

  <!-- 端口 1' 空心圆 -->
  <circle cx="235" cy="300" r="5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="235" y="318" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#0f172a">1'</text>

  <!-- 端口 2' 空心圆 -->
  <circle cx="555" cy="300" r="5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="555" y="318" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#0f172a">2'</text>

  <!-- 端口1' 与 2' 之间底部直通线（虚线框内） -->
  <line x1="240" y1="300" x2="550" y2="300" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 端口2' 到右侧并联节点 -->
  <line x1="560" y1="300" x2="715" y2="300" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 节点圆点：Is2 与 RL 底部连接 -->
  <circle cx="635" cy="300" r="3.8" fill="#0f172a"/>
  <circle cx="715" cy="300" r="3.8" fill="#0f172a"/>

  <!-- 节点圆点：端口2 与 Is2/RL 顶部连接 -->
  <circle cx="635" cy="115" r="3.8" fill="#0f172a"/>
  <circle cx="715" cy="115" r="3.8" fill="#0f172a"/>

</svg>
