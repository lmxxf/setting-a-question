<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
  <defs>
    <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-curr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-sw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- 图题 -->
  <text x="380" y="24" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#0f172a">题 2 图：含受控电压源（VCVS）的一阶 RC 换路暂态电路</text>

  <!-- ===== 上水平母线 y=115 ===== -->
  <!-- 左侧电压源上端到 R1 左端 -->
  <line x1="140" y1="115" x2="140" y2="115" stroke="#0f172a" stroke-width="2.2"/>
  <!-- 电压源支路：x=140，中心 y=207 -->
  <line x1="140" y1="115" x2="140" y2="185" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="140" cy="207" r="22" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <text x="140" y="201" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">+</text>
  <text x="140" y="221" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">−</text>
  <text x="108" y="212" text-anchor="end" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">Us = 30 V</text>
  <line x1="140" y1="229" x2="140" y2="300" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 上母线：电压源顶端 → R1 左端 -->
  <line x1="140" y1="115" x2="200" y2="115" stroke="#0f172a" stroke-width="2.2"/>
  <!-- R1 水平电阻：中心 (224, 115) -->
  <rect x="200" y="106" width="48" height="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <text x="224" y="99" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">R₁ = 4 Ω</text>
  <line x1="248" y1="115" x2="290" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 开关 S：x1=290, x2=332, y=115 -->
  <circle cx="290" cy="115" r="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="332" cy="115" r="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <line x1="293" y1="114" x2="329" y2="93" stroke="#0f172a" stroke-width="2.2"/>
  <path d="M 300 88 Q 311 78 322 88" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-sw)"/>
  <text x="311" y="72" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#2563eb">S (t = 0 断开)</text>
  <line x1="332" y1="115" x2="380" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 节点 A：x=380, y=115 -->
  <circle cx="380" cy="115" r="3.8" fill="#0f172a"/>
  <text x="380" y="104" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">A</text>

  <!-- 节点 A 向下到 R2 -->
  <line x1="380" y1="115" x2="380" y2="183" stroke="#0f172a" stroke-width="2.2"/>
  <!-- R2 垂直电阻：中心 (380, 207) -->
  <rect x="371" y="183" width="18" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <text x="396" y="212" text-anchor="start" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">R₂ = 6 Ω</text>
  <line x1="380" y1="231" x2="380" y2="300" stroke="#0f172a" stroke-width="2.2"/>

  <!-- ix 控制电流箭头（向下） -->
  <line x1="380" y1="140" x2="380" y2="168" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-ctrl)"/>
  <text x="392" y="158" text-anchor="start" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#dc2626">ix</text>

  <!-- 节点 A 向右到 R3 -->
  <line x1="380" y1="115" x2="440" y2="115" stroke="#0f172a" stroke-width="2.2"/>
  <!-- R3 水平电阻：中心 (464, 115) -->
  <rect x="440" y="106" width="48" height="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <text x="464" y="99" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">R₃ = 4 Ω</text>
  <line x1="488" y1="115" x2="530" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- VCVS 水平受控电压源：中心 (556, 115)，半宽 26，半高 20 -->
  <polygon points="530,115 556,95 582,115 556,135" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.2"/>
  <text x="546" y="120" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#b91c1c">−</text>
  <text x="566" y="120" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#b91c1c">+</text>
  <text x="556" y="89" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#b91c1c">2ix</text>
  <line x1="582" y1="115" x2="620" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 节点 B：x=620, y=115 -->
  <circle cx="620" cy="115" r="3.8" fill="#0f172a"/>
  <text x="620" y="104" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">B</text>

  <!-- 节点 B 向下到电容 -->
  <line x1="620" y1="115" x2="620" y2="203" stroke="#0f172a" stroke-width="2.2"/>
  <!-- 电容：中心 (620, 207)，极板宽 28，间隙 8 -->
  <line x1="606" y1="203" x2="634" y2="203" stroke="#0f172a" stroke-width="3.2"/>
  <line x1="606" y1="211" x2="634" y2="211" stroke="#0f172a" stroke-width="3.2"/>
  <line x1="620" y1="211" x2="620" y2="300" stroke="#0f172a" stroke-width="2.2"/>
  <text x="644" y="200" text-anchor="start" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">C = 0.25 F</text>
  <text x="644" y="218" text-anchor="start" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">uC(t)</text>
  <text x="644" y="236" text-anchor="start" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">iC(t) ↓</text>

  <!-- 下水平公共母线 y=300 -->
  <line x1="140" y1="300" x2="620" y2="300" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 接地符号：x=380, y=300 -->
  <line x1="380" y1="300" x2="380" y2="318" stroke="#0f172a" stroke-width="2.2"/>
  <line x1="366" y1="318" x2="394" y2="318" stroke="#0f172a" stroke-width="2.2"/>
  <line x1="371" y1="324" x2="389" y2="324" stroke="#0f172a" stroke-width="2.2"/>
  <line x1="376" y1="330" x2="384" y2="330" stroke="#0f172a" stroke-width="2.2"/>
  <text x="380" y="346" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#0f172a">GND</text>

  <!-- 节点圆点：下母线连接点 -->
  <circle cx="380" cy="300" r="3.8" fill="#0f172a"/>
  <circle cx="620" cy="300" r="3.8" fill="#0f172a"/>
</svg>
