<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
  <defs>
    <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-curr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-sw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- 图题 -->
  <text x="380" y="32" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#0f172a" font-weight="bold">题 1 图：含受控电流源（CCCS）的线性有源一端口网络</text>

  <!-- ================= 上水平母线 y=115 ================= -->
  <!-- 左侧：Us 到 R1 上端 -->
  <line x1="145" y1="115" x2="145" y2="185" stroke="#0f172a" stroke-width="2.2"/>
  <!-- R1 水平电阻 中心 (230,115) -->
  <rect x="206" y="106" width="48" height="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <text x="230" y="99" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">R₁ = 6 Ω</text>
  <!-- R1 左导线 -->
  <line x1="145" y1="115" x2="206" y2="115" stroke="#0f172a" stroke-width="2.2"/>
  <!-- R1 右导线到节点 A -->
  <line x1="254" y1="115" x2="380" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 节点 A -->
  <circle cx="380" cy="115" r="3.8" fill="#0f172a"/>
  <text x="380" y="99" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">A</text>

  <!-- 节点 A 向下到 R2 上端 -->
  <line x1="380" y1="115" x2="380" y2="183" stroke="#0f172a" stroke-width="2.2"/>
  <!-- R2 垂直电阻 中心 (380,207) -->
  <rect x="371" y="183" width="18" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <text x="396" y="212" text-anchor="start" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">R₂ = 12 Ω</text>
  <!-- R2 下导线到底部母线 -->
  <line x1="380" y1="231" x2="380" y2="300" stroke="#0f172a" stroke-width="2.2"/>

  <!-- I1 控制量箭头（R2 支路，向下） -->
  <line x1="380" y1="145" x2="380" y2="170" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-ctrl)"/>
  <text x="392" y="160" text-anchor="start" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#dc2626">I₁</text>

  <!-- 节点 A 向右到 R3 左端 -->
  <line x1="380" y1="115" x2="476" y2="115" stroke="#0f172a" stroke-width="2.2"/>
  <!-- R3 水平电阻 中心 (500,115) -->
  <rect x="476" y="106" width="48" height="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <text x="500" y="99" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">R₃ = 4 Ω</text>
  <!-- R3 右导线到节点 a -->
  <line x1="524" y1="115" x2="580" y2="115" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 节点 a -->
  <circle cx="580" cy="115" r="3.8" fill="#0f172a"/>
  <text x="580" y="99" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">a</text>

  <!-- 节点 a 向下到 CCCS 上端 -->
  <line x1="580" y1="115" x2="580" y2="181" stroke="#0f172a" stroke-width="2.2"/>
  <!-- CCCS 垂直受控电流源 中心 (580,207) 半宽22 半高26 -->
  <polygon points="580,181 602,207 580,233 558,207" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.2"/>
  <!-- CCCS 内部箭头：由 b 指向 a（向上） -->
  <line x1="580" y1="220" x2="580" y2="196" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow-ctrl)"/>
  <!-- CCCS 标注：放在菱形左侧安全位置 -->
  <text x="550" y="212" text-anchor="end" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#b91c1c">1·I₁</text>
  <!-- CCCS 下导线到底部母线 -->
  <line x1="580" y1="233" x2="580" y2="300" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 节点 a 向右到端口 a 空心圆 -->
  <line x1="580" y1="115" x2="640" y2="115" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="640" cy="115" r="5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="640" y="99" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">a</text>

  <!-- 端口 a 到 RL 上端虚线 -->
  <line x1="645" y1="115" x2="685" y2="115" stroke="#0f172a" stroke-width="2.2" stroke-dasharray="6,4"/>
  <line x1="685" y1="115" x2="685" y2="183" stroke="#0f172a" stroke-width="2.2" stroke-dasharray="6,4"/>

  <!-- RL 垂直电阻 中心 (685,207) -->
  <rect x="676" y="183" width="18" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="700" y="212" text-anchor="start" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">RL</text>

  <!-- RL 下端虚线到底部母线 -->
  <line x1="685" y1="231" x2="685" y2="300" stroke="#0f172a" stroke-width="2.2" stroke-dasharray="6,4"/>
  <line x1="685" y1="300" x2="645" y2="300" stroke="#0f172a" stroke-width="2.2" stroke-dasharray="6,4"/>

  <!-- 端口 b 空心圆 -->
  <circle cx="640" cy="300" r="5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="640" y="322" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">b</text>

  <!-- ================= 底部公共母线 y=300 ================= -->
  <!-- 左侧 Us 下端到母线 -->
  <line x1="145" y1="229" x2="145" y2="300" stroke="#0f172a" stroke-width="2.2"/>
  <!-- 母线：145 到 640 -->
  <line x1="145" y1="300" x2="640" y2="300" stroke="#0f172a" stroke-width="2.2"/>

  <!-- 节点 b 处接地 -->
  <line x1="380" y1="300" x2="380" y2="318" stroke="#0f172a" stroke-width="2.2"/>
  <line x1="368" y1="318" x2="392" y2="318" stroke="#0f172a" stroke-width="2.2"/>
  <line x1="372" y1="324" x2="388" y2="324" stroke="#0f172a" stroke-width="2.2"/>
  <line x1="376" y1="330" x2="384" y2="330" stroke="#0f172a" stroke-width="2.2"/>

  <!-- ================= 左侧独立电压源 Us ================= -->
  <!-- Us 圆圈 中心 (145,207) r=22 -->
  <circle cx="145" cy="207" r="22" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
  <!-- 极性符号 -->
  <text x="145" y="201" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">+</text>
  <text x="145" y="221" text-anchor="middle" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">−</text>
  <!-- Us 名称与数值 -->
  <text x="113" y="212" text-anchor="end" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#0f172a">Us = 36 V</text>

  <!-- 节点 A 与底部母线之间的连接点（R2 下端） -->
  <circle cx="380" cy="300" r="3.8" fill="#0f172a"/>

  <!-- CCCS 下端与底部母线连接点 -->
  <circle cx="580" cy="300" r="3.8" fill="#0f172a"/>

</svg>
